<!DOCTYPE html>
<html>
<head>
    <title>Cat Facts</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='catfacts.css') }}">
</head>
<body>
    <h1>Cat Facts 😺</h1>
    <button onclick="getTheCatFact()" class="catfact-btn">Get a Cat Fact</button>
    <p id="showTheFact"></p>


    <p><a href="/">Retour à l'accueil</a></p>

    <script>
        function getTheCatFact() {
            fetch("/catfacts/fact") // Recupere le body catfacts jsonifié
            .then(responseEnvelop => responseEnvelop.json()) // Ouvre l’enveloppe HTTP 👉 récupère un objet JS
            .then(dataParsedinJS => document.getElementById("showTheFact").innerHTML = dataParsedinJS.fact) // recupere le json du .then avant, et affiche la valeur de la clef fact dans le <p>
        }
    </script>
</body>
</html>
